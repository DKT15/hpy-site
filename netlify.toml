[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# React/Vite SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline browser hardening for static responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# When the site is stable, consider adding an enforced Content-Security-Policy.
# Netlify recommends testing CSP in Report-Only mode first so you can identify
# legitimate resources before blocking them.
